<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PM System - Admin Panel</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #f6f4ee;
            --surface: #fffefb;
            --s2: #faf8f2;
            --s3: #efece3;
            --acc: #2f5d50;
            --acc-s: rgba(47, 93, 80, .1);
            --acc-g: rgba(47, 93, 80, .35);
            --txt: #1f1d1a;
            --txt2: #4d4942;
            --txt3: #767168;
            --ok: #2e7d4f;
            --ok-s: rgba(46, 125, 79, .12);
            --warn: #a9690f;
            --warn-s: rgba(169, 105, 15, .12);
            --bdr: #e3ded2;
            --r: 10px;
            --rs: 8px;
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
            background: var(--bg);
            color: var(--txt);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image: linear-gradient(rgba(0, 212, 255, .013) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 212, 255, .013) 1px, transparent 1px);
            background-size: 44px 44px;
        }

        h1,
        h2,
        h3,
        .logo-text,
        .stat-val {
            font-family: 'Newsreader', Georgia, serif;
            font-weight: 600;
        }

        /* Nav */
        .nav {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            height: 64px;
            background: var(--surface);
            border-bottom: 1px solid var(--bdr);
            
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-text {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: .02em;
        }

        .logo-text span {
            color: var(--acc);
        }

        .nav-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--acc);
            box-shadow: 0 0 8px var(--acc), 0 0 20px rgba(0, 212, 255, .4);
            animation: pulse 2.4s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1)
            }

            50% {
                opacity: .5;
                transform: scale(.75)
            }
        }

        .nav-user {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-name {
            font-size: 13px;
            color: var(--txt2);
        }

        .btn-logout {
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid var(--bdr);
            background: transparent;
            color: var(--txt2);
            font-family: inherit;
            font-size: 12px;
            cursor: pointer;
            transition: all .2s;
        }

        .btn-logout:hover {
            color: #b4402f;
            border-color: rgba(180, 64, 47, .4);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--bdr);
            border-radius: var(--rs);
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            transition: border-color .2s;
        }

        .stat-card:hover {
            border-color: var(--acc-g);
        }

        .stat-lbl {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--txt3);
            margin-bottom: 8px;
        }

        .stat-val {
            font-size: 32px;
            font-weight: 700;
            color: var(--acc);
            margin-bottom: 4px;
            line-height: 1;
        }

        .stat-sub {
            font-size: 12px;
            color: var(--txt2);
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .search-input {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--bdr);
            border-radius: var(--rs);
            padding: 10px 14px;
            color: var(--txt);
            font-family: inherit;
            font-size: 13px;
            outline: none;
            transition: border-color .2s;
        }

        .search-input:focus {
            border-color: var(--acc);
        }

        /* Table */
        .table-wrap {
            background: var(--surface);
            border: 1px solid var(--bdr);
            border-radius: var(--r);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th,
        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--bdr);
        }

        th {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--txt3);
            background: var(--s2);
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: var(--s2);
        }

        .u-name {
            font-weight: 500;
            color: var(--txt);
            font-size: 14px;
        }

        .u-email {
            font-size: 12px;
            color: var(--txt2);
        }

        .u-role {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .05em;
            background: var(--s3);
            color: var(--txt2);
        }

        .u-date {
            font-size: 12px;
            color: var(--txt3);
            font-variant-numeric: tabular-nums;
        }

        .role-admin {
            background: var(--acc-s);
            color: var(--acc);
            border: 1px solid var(--acc-g);
        }

        /* Loading/Empty state */
        .state-msg {
            padding: 3rem;
            text-align: center;
            color: var(--txt3);
            font-size: 14px;
        }

        body::before { display: none; }
        body { margin: 0; }
        .nav-dot { display: none; }
        .logo-text { font-size: 18px; letter-spacing: 0; }
        .logo-text span { color: var(--txt3); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; margin-left: 4px; }
        .stat-card { box-shadow: 0 1px 2px rgba(60, 50, 30, .06); }
        .stat-card:hover { border-color: var(--bdr); }
        .stat-val { font-size: 36px; font-weight: 500; color: var(--txt); font-variant-numeric: tabular-nums; }
        .stat-lbl { font-size: 12px; letter-spacing: .05em; }
        .stat-sub { font-size: 13px; color: var(--txt3); }
        .search-input { font-size: 14px; }
        .search-input:focus { box-shadow: 0 0 0 3px var(--acc-s); }
        th { font-size: 12px; letter-spacing: .04em; }
        .u-email, .u-date { font-size: 13px; }
        .u-role { font-size: 11px; }
        td[style*="text-align:center"] { color: var(--txt) !important; font-variant-numeric: tabular-nums; }
        :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
        @media (max-width: 760px) {
            .container { padding: 1rem; }
            .nav { padding: 0 1rem; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>

    <nav class="nav">
        <div class="nav-logo">
            <div class="nav-dot"></div>
            <div class="logo-text">AI PM <span>Admin</span></div>
        </div>
        <div class="nav-user">
            <div class="user-name" id="adminName">Loading...</div>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-lbl">Total Users</div>
                <div class="stat-val" id="statTotal">-</div>
                <div class="stat-sub">Registered across all roles</div>
            </div>
            <div class="stat-card">
                <div class="stat-lbl">Active Users</div>
                <div class="stat-val" id="statActive" >-</div>
                <div class="stat-sub">Updated progress in last 7 days</div>
            </div>
            <div class="stat-card">
                <div class="stat-lbl">Avg Engagement</div>
                <div class="stat-val" id="statAvg" >-</div>
                <div class="stat-sub">Avg items completed per active user</div>
            </div>
        </div>

        <div class="toolbar">
            <input type="text" class="search-input" id="searchInput" placeholder="Search users by name or email..."
                onkeyup="filterTable()">
        </div>

        <div class="table-wrap">
            <table id="usersTable">
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Role / Study</th>
                        <th>Signup</th>
                        <th>Last Login</th>
                        <th>Last Active</th>
                        <th style="text-align:center">Items</th>
                        <th style="text-align:center">Cases</th>
                        <th style="text-align:center">Mocks</th>
                        <th>Auth</th>
                    </tr>
                </thead>
                <tbody id="usersBody">
                    <tr>
                        <td colspan="9" class="state-msg">Loading user data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let allUsers = [];

        async function init() {
            // Check auth
            try {
                const meRes = await fetch('/auth/me');
                if (meRes.status === 401) { window.location.href = '/'; return; }
                if (!meRes.ok) throw new Error('server unavailable (' + meRes.status + ')');
                const { user } = await meRes.json();

                if (user.role !== 'admin') {
                    window.location.href = '/dashboard.html';
                    return;
                }
                document.getElementById('adminName').textContent = user.name + ' (Admin)';

                fetchStats();
                fetchUsers();
            } catch (e) {
                console.error("Auth check failed", e);
                document.body.insertAdjacentHTML('afterbegin', '<p style="padding:16px;color:#f87171">Server is waking up or unreachable. Retrying in 5s...</p>');
                setTimeout(() => window.location.reload(), 5000);
            }
        }

        async function fetchStats() {
            try {
                const res = await fetch('/admin/stats');
                if (res.ok) {
                    const stats = await res.json();
                    document.getElementById('statTotal').textContent = stats.totalUsers;
                    document.getElementById('statActive').textContent = stats.activeThisWeek;
                    document.getElementById('statAvg').textContent = stats.avgItemsDone;
                }
            } catch (e) { console.error("Stats fail", e); }
        }

        async function fetchUsers() {
            try {
                const res = await fetch('/admin/users');
                if (res.ok) {
                    allUsers = await res.json();
                    renderTable(allUsers);
                } else {
                    document.getElementById('usersBody').innerHTML = `<tr><td colspan="9" class="state-msg">Failed to load users. Are you admin?</td></tr>`;
                }
            } catch (e) {
                document.getElementById('usersBody').innerHTML = `<tr><td colspan="9" class="state-msg">Error loading users.</td></tr>`;
            }
        }

        function renderTable(users) {
            const tbody = document.getElementById('usersBody');
            if (users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="state-msg">No users found</td></tr>`;
                return;
            }

            // Sort by latest created first
            users.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            tbody.innerHTML = users.map(u => {
                const p = u.progress || {};
                const itemsDone = p.itemsDone || 0;
                const cases = p.cases || 0;
                const mocks = p.mocks || 0;

                const fmt = (d) => d ? new Date(d).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '-';
                const roleClass = u.role === 'admin' ? 'role-admin' : '';
                const authMethod = u.googleId ? 'Google' : 'Email';

                return `
                    <tr>
                        <td>
                            <div class="u-name">${escapeHTML(u.name || 'Unknown')}</div>
                            <div class="u-email">${escapeHTML(u.email || '@' + (u.username || ''))}</div>
                        </td>
                        <td>
                            <span class="u-role ${roleClass}">${escapeHTML((u.role || 'learner').toUpperCase())}</span>
                            <span class="u-role" style="margin-left:4px">${escapeHTML(u.studyRole || 'N/A')}</span>
                        </td>
                        <td class="u-date">${fmt(u.createdAt)}</td>
                        <td class="u-date">${fmt(u.lastLoginAt)}</td>
                        <td class="u-date">${fmt(p.lastActive)}</td>
                        <td style="text-align:center;color:var(--acc);font-weight:600">${itemsDone}</td>
                        <td style="text-align:center;color:var(--ok);font-weight:600">${cases}</td>
                        <td style="text-align:center;color:var(--warn);font-weight:600">${mocks}</td>
                        <td class="u-date">${authMethod}</td>
                    </tr>
                `;
            }).join('');
        }

        function filterTable() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allUsers.filter(u =>
                (u.name || '').toLowerCase().includes(term) ||
                (u.email || '').toLowerCase().includes(term) ||
                (u.username || '').toLowerCase().includes(term)
            );
            renderTable(filtered);
        }

        async function logout() {
            await fetch('/auth/logout', { method: 'POST' });
            window.location.href = '/';
        }

        function escapeHTML(str) {
            return String(str == null ? '' : str).replace(/[&<>'"]/g,
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }

        init();
    </script>
</body>

</html>
