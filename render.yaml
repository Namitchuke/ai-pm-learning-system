# ============================================================
# AI PM Autonomous Learning & Intelligence System
# render.yaml — TDD v2.0 §Deployment / Render Configuration
# ============================================================

services:
  # ---- Website (Node/Express + MongoDB): learner dashboard + admin ----
  - type: web
    name: ai-pm-learning-app
    env: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  # ---- RSS / email pipeline (Python/FastAPI) ----
  - type: web
    name: ai-pm-learning
    env: python
    plan: free
    region: singapore  # Closest to IST timezone
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/ping

    envVars:
      # -- Authentication --
      - key: API_KEY
        sync: false

      - key: CRON_SECRET
        sync: false

      - key: DASHBOARD_USER
        sync: false

      - key: DASHBOARD_PASS
        sync: false

      - key: CSRF_SECRET
        sync: false

      # -- Google APIs --
      - key: GEMINI_API_KEY
        sync: false

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: GOOGLE_REFRESH_TOKEN
        sync: false

      - key: DRIVE_FOLDER_NAME
        value: AI_PM_SYSTEM

      # -- Email --
      - key: SENDER_EMAIL
        sync: false

      - key: RECIPIENT_EMAIL
        sync: false

      # -- Model Configuration (L2-17) --
      - key: GEMINI_BULK_MODEL
        value: gemini-2.0-flash-lite

      - key: GEMINI_GRADE_MODEL
        value: gemini-2.5-flash

      # -- App Settings --
      - key: ENVIRONMENT
        value: production

      - key: LOG_LEVEL
        value: INFO
